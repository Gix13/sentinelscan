    <path d="M72 187l43-44 34 26 70-78" fill="none" stroke="url(#accent)" stroke-width="8" filter="url(#glow)"/>
    <circle cx="72" cy="187" r="7" fill="#fff"/><circle cx="115" cy="143" r="7" fill="#fff"/><circle cx="149" cy="169" r="7" fill="#fff"/><circle cx="219" cy="91" r="7" fill="#fff"/>
